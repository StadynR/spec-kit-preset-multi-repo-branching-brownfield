schema_version: "1.0"

preset:
  id: "multi-repo-branching-brownfield"
  name: "Multi-Repo Branching with Brownfield Support"
  version: "1.0.0"
  description: "Coordinates feature branch creation across multiple git repositories (independent repos and submodules) during plan and tasks phases."
  author: "StadynR"
  repository: "https://github.com/StadynR/spec-kit-preset-multi-repo-branching-brownfield"
  license: "MIT"

requires:
  speckit_version: ">=0.4.0"

provides:
  templates:
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Plan command with multi-repo discovery and analysis"
      replaces: "speckit.plan"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Tasks command with multi-repo branch-creation task generation"
      replaces: "speckit.tasks"

    - type: "command"
      name: "speckit.brownfield.scan"
      file: "commands/speckit.brownfield.scan.md"
      description: "Brownfield scan with multi-repo discovery"
      replaces: "speckit.brownfield.scan"

    - type: "command"
      name: "speckit.brownfield.bootstrap"
      file: "commands/speckit.brownfield.bootstrap.md"
      description: "Brownfield bootstrap with multi-repo configuration"
      replaces: "speckit.brownfield.bootstrap"

    - type: "command"
      name: "speckit.brownfield.validate"
      file: "commands/speckit.brownfield.validate.md"
      description: "Brownfield validation with multi-repo checks"
      replaces: "speckit.brownfield.validate"

    - type: "command"
      name: "speckit.brownfield.migrate"
      file: "commands/speckit.brownfield.migrate.md"
      description: "Brownfield migration with multi-repo scope tracking"
      replaces: "speckit.brownfield.migrate"

tags:
  - "multi-repo-branching"
  - "multi-module"
  - "submodules"
  - "monorepo"
